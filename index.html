<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hisobotlar & Sverka</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        .header {
            padding: 16px;
            text-align: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .balance-card {
            margin: 16px;
            padding: 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .balance-card h2 {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-card .amount {
            font-size: 32px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 10px rgba(59, 130, 246, 0.5);
        }

        .step-container {
            flex: 1;
            position: relative;
            padding: 16px;
            overflow: hidden;
        }

        .step {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            transform: translateX(100%);
        }

        .step.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
            position: relative;
            top: 0;
            left: 0;
            right: 0;
        }

        .step.previous {
            transform: translateX(-100%);
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 16px;
        }

        h3 {
            margin-bottom: 16px;
            font-size: 18px;
            color: #fff;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            border: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(to right, #10b981, #059669);
            border: none;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-danger {
            background: linear-gradient(to right, #ef4444, #dc2626);
            border: none;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-warning {
            background: linear-gradient(to right, #f59e0b, #d97706);
            border: none;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
        }
        
        .client-list {
            max-height: 280px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .client-item {
            padding: 14px;
            border-bottom: 1px solid var(--glass-border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
        }

        .client-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .client-item:last-child {
            border-bottom: none;
        }

        .sverka-summary {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .summary-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .summary-box .title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .summary-box .val {
            font-size: 15px;
            font-weight: 700;
            margin-top: 4px;
        }

        .tx-list {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .tx-item {
            padding: 10px;
            border-bottom: 1px solid var(--glass-border);
            font-size: 13px;
        }

        .tx-item .top-row {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .tx-item .bot-row {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 4px;
        }

        .loader {
            display: none;
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Hisob-kitob & Sverka</h1>
    </div>

    <div class="balance-card">
        <h2>Umumiy Balans</h2>
        <div class="amount" id="balanceDisplay">0 UZS</div>
    </div>

    <div class="step-container">
        <!-- Step 1: Main Menu -->
        <div class="step active" id="step-main">
            <div class="glass-panel">
                <button class="btn btn-success" onclick="startFlow('kirim')">🟢 Kirim Qo'shish (+)</button>
                <button class="btn btn-danger" onclick="startFlow('chiqim')">🔴 Chiqim Qo'shish (-)</button>
                <button class="btn btn-warning" onclick="startFlow('sverka')">📋 Mijoz bilan Sverka (Hisobot)</button>
            </div>
        </div>

        <!-- Step 2: Select/Add Client -->
        <div class="step" id="step-client">
            <div class="glass-panel">
                <h3 id="clientTitle">Mijozni tanlang</h3>
                <div class="loader" id="clientLoader"></div>
                <div class="client-list" id="clientList"></div>
                
                <div style="margin-top: 15px; border-top: 1px solid var(--glass-border); padding-top: 15px;">
                    <div class="input-group">
                        <label>👤 Yangi mijoz qo'shish</label>
                        <input type="text" id="newClientName" placeholder="Mijoz ismini kiriting">
                    </div>
                    <button class="btn btn-primary" onclick="addNewClient()">Qo'shish</button>
                </div>
                <button class="btn" style="margin-top: 5px;" onclick="goToStep('step-main')">⬅️ Ortga</button>
            </div>
        </div>

        <!-- Step 3: Kirim Form -->
        <div class="step" id="step-kirim">
            <div class="glass-panel">
                <h3>🟢 Kirim ma'lumotlari</h3>
                <div class="input-group">
                    <label>Summa (UZS)</label>
                    <input type="number" id="kirimSumma" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Ushlab qolinadigan foiz % (Ixtiyoriy)</label>
                    <input type="number" step="0.01" id="kirimFoiz" placeholder="Masalan: 1.5">
                </div>
                <div class="input-group">
                    <label>Kategoriya</label>
                    <input type="text" id="kirimKategoriya" placeholder="Masalan: savdo">
                </div>
                <div class="input-group">
                    <label>Izoh</label>
                    <input type="text" id="kirimIzoh" placeholder="Izoh qoldiring">
                </div>
                <button class="btn btn-success" id="btnSaveKirim" onclick="saveKirim()">💾 Saqlash</button>
                <button class="btn" onclick="goToStep('step-client')">⬅️ Ortga</button>
            </div>
        </div>

        <!-- Step 4: Chiqim Form -->
        <div class="step" id="step-chiqim">
            <div class="glass-panel">
                <h3>🔴 Chiqim ma'lumotlari</h3>
                <div class="input-group">
                    <label>Summa (UZS)</label>
                    <input type="number" id="chiqimSumma" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Kategoriya</label>
                    <input type="text" id="chiqimKategoriya" placeholder="Masalan: xarajat">
                </div>
                <div class="input-group">
                    <label>Izoh</label>
                    <input type="text" id="chiqimIzoh" placeholder="Izoh qoldiring">
                </div>
                <button class="btn btn-danger" id="btnSaveChiqim" onclick="saveChiqim()">💾 Saqlash</button>
                <button class="btn" onclick="goToStep('step-client')">⬅️ Ortga</button>
            </div>
        </div>

        <!-- Step 5: Sverka View -->
        <div class="step" id="step-sverka">
            <div class="glass-panel">
                <h3 id="sverkaClientTitle">📋 Sverka Hujjati</h3>
                
                <div class="sverka-summary" style="grid-template-columns: 1fr 1fr 1fr;">
                    <div class="summary-box">
                        <div class="title">Jami Kirim</div>
                        <div class="val" style="color: var(--success);" id="svJamiKirim">0</div>
                    </div>
                    <div class="summary-box">
                        <div class="title">Sof Kirim</div>
                        <div class="val" style="color: var(--primary);" id="svJamiSof">0</div>
                    </div>
                    <div class="summary-box">
                        <div class="title">Jami Chiqim</div>
                        <div class="val" style="color: var(--danger);" id="svJamiChiqim">0</div>
                    </div>
                </div>

                <div class="glass-panel" style="padding: 12px; text-align: center; margin-bottom: 16px; background: rgba(59, 130, 246, 0.15);">
                    <div style="font-size: 12px; color: var(--text-muted);">QOLDIQ BALANS</div>
                    <div style="font-size: 24px; font-weight: 700; color: #fff;" id="svQoldiqBalans">0 UZS</div>
                </div>

                <h4>Operatsiyalar tarixi:</h4>
                <div class="tx-list" id="sverkaTxList"></div>

                <button class="btn btn-primary" id="btnSendReport" onclick="sendTelegramReport()">📤 Telegram-ga Otchot Jo'natish</button>
                <button class="btn" onclick="goToStep('step-client')">⬅️ Ortga</button>
            </div>
        </div>

        <!-- Step 6: Edit Kirim Form -->
        <div class="step" id="step-edit-kirim">
            <div class="glass-panel">
                <h3>✏️ Kirimni Tahrirlash</h3>
                <input type="hidden" id="editKirimId">
                <div class="input-group">
                    <label>Summa (UZS)</label>
                    <input type="number" id="editKirimSumma" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Ushlab qolinadigan foiz %</label>
                    <input type="number" step="0.01" id="editKirimFoiz" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Kategoriya</label>
                    <input type="text" id="editKirimKategoriya" placeholder="Kategoriya">
                </div>
                <div class="input-group">
                    <label>Izoh</label>
                    <input type="text" id="editKirimIzoh" placeholder="Izoh">
                </div>
                <button class="btn btn-warning" id="btnSaveEditKirim" onclick="saveEditKirim()">💾 O'zgarishlarni Saqlash</button>
                <button class="btn" onclick="goToStep('step-sverka')">⬅️ Ortga</button>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) tg.expand();
        
        let currentFlow = ''; // 'kirim', 'chiqim', 'sverka'
        let selectedClientId = null;
        let selectedClientName = '';
        let currentSverkaData = null;
        const API_BASE = '';

        function formatMoney(amount) {
            return new Intl.NumberFormat('uz-UZ').format(amount) + ' UZS';
        }

        async function fetchBalance() {
            try {
                const res = await fetch(`${API_BASE}/api/balance`);
                const data = await res.json();
                if(data.success) {
                    document.getElementById('balanceDisplay').innerText = formatMoney(data.balance);
                }
            } catch(e) {
                console.error("Error fetching balance:", e);
            }
        }

        function goToStep(stepId) {
            document.querySelectorAll('.step').forEach(el => {
                if(el.classList.contains('active')) {
                    el.classList.remove('active');
                    el.classList.add('previous');
                } else {
                    el.classList.remove('previous');
                }
            });
            setTimeout(() => {
                const target = document.getElementById(stepId);
                target.classList.remove('previous');
                target.classList.add('active');
            }, 50);
        }

        function startFlow(type) {
            currentFlow = type;
            loadClients();
            goToStep('step-client');
        }

        async function loadClients() {
            const loader = document.getElementById('clientLoader');
            const list = document.getElementById('clientList');
            loader.style.display = 'block';
            list.innerHTML = '';
            
            try {
                const res = await fetch(`${API_BASE}/api/clients`);
                const data = await res.json();
                
                loader.style.display = 'none';
                if(data.success && data.clients) {
                    data.clients.forEach(c => {
                        const div = document.createElement('div');
                        div.className = 'client-item';
                        div.innerHTML = `<span>👤 <strong>${c.ism}</strong></span> <span>➡️</span>`;
                        div.onclick = () => selectClient(c.id, c.ism);
                        list.appendChild(div);
                    });
                }
            } catch(e) {
                loader.style.display = 'none';
                if(tg) tg.showAlert("Mijozlarni yuklashda xatolik!");
            }
        }

        async function addNewClient() {
            const nameInput = document.getElementById('newClientName');
            const name = nameInput.value.trim();
            if(!name) {
                if(tg) tg.showAlert("Ism kiritish majburiy!");
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/api/clients`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ism: name})
                });
                const data = await res.json();
                if(data.success) {
                    nameInput.value = '';
                    selectClient(data.client.id, data.client.ism);
                }
            } catch(e) {
                if(tg) tg.showAlert("Xatolik yuz berdi!");
            }
        }

        function selectClient(id, name) {
            selectedClientId = id;
            selectedClientName = name;
            if(currentFlow === 'kirim') {
                goToStep('step-kirim');
            } else if(currentFlow === 'chiqim') {
                goToStep('step-chiqim');
            } else if(currentFlow === 'sverka') {
                loadSverka(id);
            }
        }

        async function loadSverka(clientId) {
            const list = document.getElementById('sverkaTxList');
            list.innerHTML = '<div style="text-align:center; padding: 20px;">Yuklanmoqda...</div>';
            goToStep('step-sverka');

            try {
                const res = await fetch(`${API_BASE}/api/sverka/${clientId}`);
                const data = await res.json();
                if(data.success && data.sverka) {
                    currentSverkaData = data.sverka;
                    const sv = data.sverka;
                    document.getElementById('sverkaClientTitle').innerText = `📋 Sverka: ${sv.klient_name}`;
                    document.getElementById('svJamiKirim').innerText = formatMoney(sv.jami_kirim);
                    document.getElementById('svJamiSof').innerText = formatMoney(sv.jami_sof_kirim);
                    document.getElementById('svJamiChiqim').innerText = formatMoney(sv.jami_chiqim);
                    document.getElementById('svQoldiqBalans').innerText = formatMoney(sv.qoldiq_balans);

                    if(!sv.yozuvlar || sv.yozuvlar.length === 0) {
                        list.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 15px;">Operatsiyalar topilmadi</div>';
                    } else {
                        list.innerHTML = sv.yozuvlar.slice().reverse().map(y => `
                            <div class="tx-item">
                                <div class="top-row">
                                    <span style="color: ${y.turi === 'kirim' ? 'var(--success)' : 'var(--danger)'}">
                                        ${y.turi === 'kirim' ? '🟢 Kirim' : '🔴 Chiqim'}
                                    </span>
                                    <span>
                                        ${formatMoney(y.summa)}
                                        ${y.turi === 'kirim' ? `<button onclick="openEditKirim(${y.id}, ${y.summa}, ${y.foiz || 0}, '${(y.kategoriya || '').replace(/'/g, "\\'")}', '${(y.izoh || '').replace(/'/g, "\\'")}')" style="background:none; border:none; color: var(--warning); cursor:pointer; margin-left: 8px; font-size:14px;" title="Tahrirlash">✏️</button>` : ''}
                                    </span>
                                </div>
                                <div class="bot-row">
                                    <span>${y.sana} ${y.vaqt}</span>
                                    <span>${y.kategoriya || ''}</span>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            } catch(e) {
                list.innerHTML = '<div style="text-align:center; color: var(--danger);">Xatolik yuz berdi!</div>';
            }
        }

        function openEditKirim(id, summa, foiz, kategoriya, izoh) {
            document.getElementById('editKirimId').value = id;
            document.getElementById('editKirimSumma').value = summa;
            document.getElementById('editKirimFoiz').value = foiz;
            document.getElementById('editKirimKategoriya').value = kategoriya;
            document.getElementById('editKirimIzoh').value = izoh;
            goToStep('step-edit-kirim');
        }

        async function saveEditKirim() {
            const id = document.getElementById('editKirimId').value;
            const summa = document.getElementById('editKirimSumma').value;
            const foiz = document.getElementById('editKirimFoiz').value;
            const kategoriya = document.getElementById('editKirimKategoriya').value;
            const izoh = document.getElementById('editKirimIzoh').value;

            if(!id || !summa) {
                if(tg) tg.showAlert("Summani kiriting!");
                return;
            }

            const btn = document.getElementById('btnSaveEditKirim');
            btn.innerText = "Saqlanmoqda...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/kirim/edit`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        id: parseInt(id),
                        summa: parseFloat(summa),
                        foiz: parseFloat(foiz || 0),
                        kategoriya: kategoriya,
                        izoh: izoh
                    })
                });
                const data = await res.json();
                if(data.success) {
                    if(tg) {
                        tg.showAlert("✅ Kirim o'zgarmalari muvaffaqiyatli saqlandi!", () => {
                            fetchBalance();
                            loadSverka(selectedClientId);
                        });
                    } else {
                        fetchBalance();
                        loadSverka(selectedClientId);
                    }
                } else {
                    if(tg) tg.showAlert("Xatolik: " + data.error);
                }
            } catch(e) {
                if(tg) tg.showAlert("Tizim xatoligi!");
            } finally {
                btn.innerText = "💾 O'zgarishlarni Saqlash";
                btn.disabled = false;
            }
        }

        async function sendTelegramReport() {
            const chatId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
            if(!chatId) {
                alert("Telegram chat ID aniqlanmadi! Bot orqali kiring.");
                return;
            }

            const btn = document.getElementById('btnSendReport');
            btn.innerText = "Jo'natilmoqda...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/send-report`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        klient_id: selectedClientId,
                        chat_id: chatId
                    })
                });
                const data = await res.json();
                if(data.success) {
                    if(tg) tg.showAlert("✅ Hisobot Telegram botingizga jo'natildi!");
                } else {
                    if(tg) tg.showAlert("Xatolik: " + data.error);
                }
            } catch(e) {
                if(tg) tg.showAlert("Tizim xatoligi!");
            } finally {
                btn.innerText = "📤 Telegram-ga Otchot Jo'natish";
                btn.disabled = false;
            }
        }

        async function saveKirim() {
            const summa = document.getElementById('kirimSumma').value;
            const foiz = document.getElementById('kirimFoiz').value;
            const kategoriya = document.getElementById('kirimKategoriya').value;
            const izoh = document.getElementById('kirimIzoh').value;
            
            if(!summa) {
                if(tg) tg.showAlert("Summani kiriting!");
                return;
            }
            
            const btn = document.getElementById('btnSaveKirim');
            btn.innerText = "Saqlanmoqda...";
            btn.disabled = true;
            
            try {
                const res = await fetch(`${API_BASE}/api/kirim`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        klient_id: selectedClientId,
                        summa: parseFloat(summa),
                        foiz: parseFloat(foiz || 0),
                        kategoriya: kategoriya,
                        izoh: izoh
                    })
                });
                const data = await res.json();
                if(data.success) {
                    if(tg) {
                        tg.showAlert("Kirim muvaffaqiyatli saqlandi!", () => {
                            document.getElementById('kirimSumma').value = '';
                            document.getElementById('kirimFoiz').value = '';
                            document.getElementById('kirimKategoriya').value = '';
                            document.getElementById('kirimIzoh').value = '';
                            fetchBalance();
                            goToStep('step-main');
                        });
                    }
                } else {
                    if(tg) tg.showAlert("Xatolik: " + data.error);
                }
            } catch(e) {
                if(tg) tg.showAlert("Tizim xatoligi!");
            } finally {
                btn.innerText = "💾 Saqlash";
                btn.disabled = false;
            }
        }

        async function saveChiqim() {
            const summa = document.getElementById('chiqimSumma').value;
            const kategoriya = document.getElementById('chiqimKategoriya').value;
            const izoh = document.getElementById('chiqimIzoh').value;
            
            if(!summa) {
                if(tg) tg.showAlert("Summani kiriting!");
                return;
            }
            
            const btn = document.getElementById('btnSaveChiqim');
            btn.innerText = "Saqlanmoqda...";
            btn.disabled = true;
            
            try {
                const res = await fetch(`${API_BASE}/api/chiqim`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        klient_id: selectedClientId,
                        summa: parseFloat(summa),
                        kategoriya: kategoriya,
                        izoh: izoh
                    })
                });
                const data = await res.json();
                if(data.success) {
                    if(tg) {
                        tg.showAlert("Chiqim muvaffaqiyatli saqlandi!", () => {
                            document.getElementById('chiqimSumma').value = '';
                            document.getElementById('chiqimKategoriya').value = '';
                            document.getElementById('chiqimIzoh').value = '';
                            fetchBalance();
                            goToStep('step-main');
                        });
                    }
                } else {
                    if(tg) tg.showAlert("Xatolik: " + data.error);
                }
            } catch(e) {
                if(tg) tg.showAlert("Tizim xatoligi!");
            } finally {
                btn.innerText = "💾 Saqlash";
                btn.disabled = false;
            }
        }

        // Init
        fetchBalance();
        if(tg) tg.ready();
    </script>
</body>
</html>
